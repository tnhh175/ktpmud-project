          $ref: '#/components/schemas/PaginationMeta'

    CreateUserRequest:
      type: object
      required:
        - username
        - fullName
        - role
        - isActive
        - reason
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
          default: true
        reason:
          type: string
          minLength: 3
          maxLength: 300

    CreateUserResponse:
      type: object
      required:
        - user
        - oneTimeSetupCode
        - setupExpiresAt
      properties:
        user:
          $ref: '#/components/schemas/AppUser'
        oneTimeSetupCode:
          type: string
          description: "Mã thiết lập mật khẩu một lần (chỉ hiển thị đúng 1 lần khi tạo, không lưu dạng rõ)"
        setupExpiresAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      required:
        - rowVersion
        - reason
      properties:
        rowVersion:
          type: integer
          minimum: 1
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        resetPassword:
          type: boolean
          default: false
        reason:
          type: string
          minLength: 3
          maxLength: 300
          description: "Lý do thay đổi quyền, khóa/mở tài khoản hoặc đặt lại mật khẩu để ghi vào AuditLog"

    UpdateUserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/AppUser'
        oneTimeSetupCode:
          type: [string, 'null']
          description: "Chỉ trả về khi resetPassword = true"

    PermissionPreviewRequest:
      type: object
      required:
