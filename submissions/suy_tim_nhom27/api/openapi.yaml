      summary: "M5 — Xem lại dữ liệu lượt khám, kiểm tra lỗi Tầng 3 và trạng thái sẵn sàng Tầng 4"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Tổng hợp số lượng trường theo 4 trạng thái (`answered`, `unfilled`, `unknown`, `validationError`) trên toàn biểu mẫu và theo từng nhóm trong 8 `SectionCode`.
        Tách bạch rõ theo chốt K1:
        - `tier3ConfirmErrors`: Các lỗi hoặc thiếu sót ở trường có `requiredForConfirm = true` (Tầng 3) — sẽ chặn thao tác `confirmVisit` nếu còn lỗi.
        - `tier4AiModules`: Trạng thái sẵn sàng (`ready`, `missingFieldCodes`) tính riêng cho từng module AI (Tầng 4) — chỉ mang tính thông tin đối chiếu, không chặn việc xác nhận lượt khám.
      x-screen: M5
      x-allowed-roles: [doctor]
      responses:
        '200':
          description: "Kết quả rà soát lượt khám trước khi xác nhận"
