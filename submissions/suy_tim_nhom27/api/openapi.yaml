        - orthostaticBp
        - medications
        - allergies
        - labResults
        - revisions
      properties:
        visit:
          $ref: '#/components/schemas/Visit'
        values:
          type: array
          items:
            $ref: '#/components/schemas/VisitValue'
        orthostaticBp:
          type: array
          items:
            $ref: '#/components/schemas/OrthostaticBpMeasurement'
        medications:
          type: array
          items:
            $ref: '#/components/schemas/VisitMedication'
        allergies:
          type: array
          items:
            $ref: '#/components/schemas/VisitAllergy'
        labResults:
          type: array
          items:
            $ref: '#/components/schemas/VisitLabResult'
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/VisitRevision'

    VisitFormStructureResponse:
      type: object
      required:
        - visitId
        - formVersion
        - sections
        - fieldDefinitions
      properties:
        visitId:
          type: string
          format: uuid
        formVersion:
          $ref: '#/components/schemas/FormVersion'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/FormSection'
        fieldDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinition'

    SaveVisitDraftRequest:
      type: object
      required:
        - rowVersion
        - values
        - orthostaticBp
        - medications
        - allergies
      properties:
        rowVersion:
          type: integer
          minimum: 1
          description: "Khóa kiểm soát sửa đồng thời khớp với header If-Match"
        clinicalNote:
          type: [string, 'null']
        infoSource:
          type: [string, 'null']
        values:
          type: array
          items:
            $ref: '#/components/schemas/VisitValue'
        orthostaticBp:
          type: array
          items:
            $ref: '#/components/schemas/OrthostaticBpMeasurement'
        medications:
          type: array
          items:
            $ref: '#/components/schemas/VisitMedication'
        allergies:
          type: array
          items:
            $ref: '#/components/schemas/VisitAllergy'
        labResults:
          type: array
          items:
            $ref: '#/components/schemas/VisitLabResult'

    SectionReviewSummary:
      type: object
      required:
        - sectionCode
        - titleVi
        - answeredCount
        - unfilledCount
        - unknownCount
        - errorCount
      properties:
        sectionCode:
          $ref: '#/components/schemas/SectionCode'
        titleVi:
          type: string
        answeredCount:
          type: integer
          minimum: 0
        unfilledCount:
          type: integer
          minimum: 0
        unknownCount:
          type: integer
          minimum: 0
        errorCount:
          type: integer
          minimum: 0

    VisitReviewResponse:
      type: object
      required:
        - visitId
        - formVersionId
        - rowVersion
        - readinessTier
        - canConfirm
        - totalAnswered
        - totalUnfilled
        - totalUnknown
        - totalErrors
        - sections
        - tier3ConfirmErrors
        - tier4AiModules
      properties:
        visitId:
          type: string
          format: uuid
        formVersionId:
          type: string
          format: uuid
        rowVersion:
          type: integer
          minimum: 1
        readinessTier:
          $ref: '#/components/schemas/ReadinessTier'
        canConfirm:
          type: boolean
          description: "Bằng true khi tier3ConfirmErrors rỗng và không còn lỗi kỹ thuật"
        totalAnswered:
          type: integer
          minimum: 0
        totalUnfilled:
          type: integer
          minimum: 0
        totalUnknown:
          type: integer
          minimum: 0
        totalErrors:
          type: integer
          minimum: 0
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionReviewSummary'
        tier3ConfirmErrors:
          type: array
          description: "Danh sách lỗi Tầng 3 chặn xác nhận lượt khám"
          items:
            $ref: '#/components/schemas/FieldValidationError'
        tier4AiModules:
          type: array
          description: "Trạng thái sẵn sàng Tầng 4 cho từng module AI (không chặn xác nhận lượt khám)"
          items:
            $ref: '#/components/schemas/AiModuleReadiness'

