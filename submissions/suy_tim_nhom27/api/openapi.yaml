        errors:
          type: array
          description: "Danh sách lỗi chi tiết tại từng trường khi mã trạng thái là 422"
          items:
            $ref: '#/components/schemas/FieldValidationError'

    FieldValidationError:
      type: object
      required:
        - fieldCode
        - message
      properties:
        fieldCode:
          type: string
          example: spo2
        sectionCode:
          $ref: '#/components/schemas/SectionCode'
        message:
          type: string
          example: "Giá trị SpO2 không được vượt quá 100%"
        rejectedValue:
          type: [number, string, boolean, 'null']

    PaginationMeta:
      type: object
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    # =========================================================================
    # 4. Các Schema Request / Response cho các operation
    # =========================================================================
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          example: bs.minh
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 16

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    AuthTokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
          default: Bearer
        expiresIn:
          type: integer
          description: "Thời hạn hiệu lực của accessToken tính bằng giây"
          example: 900
        user:
          $ref: '#/components/schemas/AppUser'

    PatientListItem:
      type: object
      required:
        - patient
        - visitCount
        - latestVisitStatus
      properties:
        patient:
          $ref: '#/components/schemas/Patient'
        visitCount:
          type: integer
          minimum: 0
        latestVisitId:
          type: [string, 'null']
          format: uuid
        latestVisitDate:
          type: [string, 'null']
          format: date-time
        latestVisitStatus:
          type: string
          enum: [draft, confirmed, none]

    PatientListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatientListItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    CreatePatientRequest:
      type: object
      required:
        - fullName
        - sex
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        sex:
          type: string
          enum: [male, female, unknown]
        birthDate:
          type: [string, 'null']
          format: date
        birthYear:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
        declaredAge:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        externalPatientCode:
          type: [string, 'null']
          maxLength: 64

    UpdatePatientRequest:
      type: object
      required:
        - rowVersion
      properties:
        rowVersion:
          type: integer
          minimum: 1
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        sex:
          type: string
          enum: [male, female, unknown]
        birthDate:
          type: [string, 'null']
          format: date
        birthYear:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
        declaredAge:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        externalPatientCode:
          type: [string, 'null']
          maxLength: 64

    LatestVisitClinicalSummary:
      type: object
      description: "Tóm tắt lâm sàng lượt khám gần nhất trên Màn 3 (chỉ hiển thị khi có ghi nhận thực tế, luôn kèm nguồn)"
      required:
        - sourceVisitId
        - sourceVisitDate
        - sourceVisitStatus
        - sourceFormVersionId
        - sourceRowVersion
      properties:
        sourceVisitId:
          type: string
          format: uuid
        sourceVisitCode:
          type: string
          example: LK-20261112-01
        sourceVisitDate:
          type: string
          format: date-time
        sourceVisitStatus:
          $ref: '#/components/schemas/VisitStatus'
        sourceFormVersionId:
          type: string
          format: uuid
        sourceRowVersion:
          type: integer
          minimum: 1
        heightCm:
          type: [number, 'null']
        weightKg:
          type: [number, 'null']
        bmi:
          type: [number, 'null']
        latestBp:
          anyOf:
            - $ref: '#/components/schemas/OrthostaticBpMeasurement'
            - type: 'null'
        recordedMedications:
          type: array
          items:
            $ref: '#/components/schemas/VisitMedication'
        recordedAllergies:
          type: array
          items:
            $ref: '#/components/schemas/VisitAllergy'

    PatientDetailResponse:
      type: object
      required:
        - patient
      properties:
        patient:
          $ref: '#/components/schemas/Patient'
        latestVisitSummary:
          anyOf:
            - $ref: '#/components/schemas/LatestVisitClinicalSummary'
            - type: 'null'

    VisitListResponse:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    CreateVisitRequest:
      type: object
      required:
        - visitDate
      properties:
        visitDate:
          type: string
          format: date-time
        visitType:
          type: string
          enum: [outpatient_new, follow_up, acute_inpatient]
          default: outpatient_new
        chiefComplaint:
          type: [string, 'null']
          maxLength: 500
        externalVisitCode:
          type: [string, 'null']
          maxLength: 64

    VisitDetailResponse:
      type: object
      required:
        - visit
