        - Chỉ xuất cho lượt khám có `status = confirmed` (gọi trên lượt `draft` trả `409`).
        - Trường chưa điền không xuất hiện trong `values`.
        - Trường "Chưa rõ" xuất hiện trong `values` với `state: "unknown"`.
