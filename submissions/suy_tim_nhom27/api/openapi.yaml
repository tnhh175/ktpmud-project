components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Access Token cấp sau khi đăng nhập qua `/api/v1/auth/login`.

        Chứa `sub` (UUID của `AppUser`), `role` (`doctor` hoặc `admin`) và `sid` (`UserSession.id`).

        '
  parameters:
    PatientIdParam:
      name: patientId
      in: path
      required: true
      description: Định danh UUID nội bộ của hồ sơ bệnh nhân
      schema:
        type: string
        format: uuid
    VisitIdParam:
      name: visitId
      in: path
      required: true
      description: Định danh UUID của lượt khám
      schema:
        type: string
        format: uuid
    UserIdParam:
      name: userId
      in: path
      required: true
      description: Định danh UUID của tài khoản người dùng
      schema:
        type: string
        format: uuid
    FormIdParam:
      name: formId
      in: path
      required: true
      description: Định danh UUID của mẫu biểu mẫu logic (FormTemplate)
      schema:
        type: string
        format: uuid
    VersionIdParam:
      name: versionId
      in: path
      required: true
      description: Định danh UUID của phiên bản biểu mẫu (FormVersion)
      schema:
        type: string
        format: uuid
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: 'Giá trị ETag đại diện cho `rowVersion` hiện tại của bản ghi (ví
        dụ `"1"`, `"2"` hoặc `W/"2"`).

        Nếu không khớp với `rowVersion` trên máy chủ, thao tác ghi bị từ chối với
        mã `409 Conflict`.

        '
      schema:
        type: string
        example: '"1"'
    PageParam:
      name: page
      in: query
      required: false
      description: Số thứ tự trang (bắt đầu từ 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Số lượng bản ghi tối đa trên một trang
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    ETagHeader:
      description: Giá trị ETag hiện tại của tài nguyên tương ứng với rowVersion
      schema:
        type: string
        example: '"2"'
  responses:
    UnauthorizedError:
      description: 401 Unauthorized — Chưa đăng nhập, thông tin đăng nhập không đúng
        hoặc token đã hết hạn/bị thu hồi
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: 403 Forbidden — Không đủ quyền truy cập theo ranh giới RBAC (doctor
        vs admin) hoặc tài khoản đã bị khóa
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: 404 Not Found — Không tìm thấy tài nguyên theo định danh UUID yêu
        cầu
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictError:
      description: 409 Conflict — Xung đột sửa đồng thời (lệch ETag/rowVersion), vi
        phạm tính bất biến (form_version đã published, visit đã confirmed) hoặc trùng
        khóa duy nhất
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntityError:
      description: 422 Unprocessable Entity — Dữ liệu đầu vào sai kiểu, vượt miền
        giá trị kỹ thuật hoặc chưa đạt điều kiện Tầng 3 khi xác nhận
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
