        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /admin/form-versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/VersionIdParam'
    get:
      tags: [AdminForms]
      operationId: getFormVersion
      summary: "M7 — Xem chi tiết cấu trúc của một phiên bản biểu mẫu"
      description: |
        Chỉ dành cho vai trò `admin` (`doctor` nhận `403`).
        Trả về thông tin `FormVersion`, 8 nhóm `FormSection`, các vị trí trường `FormField`, định nghĩa `FieldDefinition` và `FieldOption`.
      x-screen: M7
      x-allowed-roles: [admin]
      responses:
        '200':
          description: "Chi tiết phiên bản biểu mẫu"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersionDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

    patch:
      tags: [AdminForms]
      operationId: updateFormVersion
      summary: "M7 — Chỉnh sửa cấu trúc nhóm, trường và thuộc tính trên bản nháp biểu mẫu"
      description: |
        Chỉ dành cho vai trò `admin` (`doctor` nhận `403`). Bắt buộc gửi `If-Match`.
        - Chỉ cho phép chỉnh sửa khi phiên bản có `status = draft`.
        - Nếu phiên bản đang ở trạng thái `published` hoặc `retired`, bắt buộc trả `409 Conflict` (chốt K4: phiên bản đã phát hành là bất biến ở cả tầng API và DB trigger).
        - Ghi `AuditLog` (`action = form_version_update`).
      x-screen: M7
      x-allowed-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFormVersionRequest'
      responses:
        '200':
          description: "Cập nhật bản nháp phiên bản biểu mẫu thành công"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersionDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

    delete:
      tags: [AdminForms]
      operationId: deleteFormVersionDraft
      summary: "M7 — Xóa phiên bản biểu mẫu còn là bản nháp"
      description: |
        Chỉ dành cho vai trò `admin` (`doctor` nhận `403`). Chỉ xóa phiên bản
        có `status = draft` và chưa gắn với lượt khám; phiên bản đã phát hành,
        đã nghỉ hiệu lực hoặc đang được sử dụng nhận `409 Conflict`.
        Header `If-Match` là tùy chọn ở endpoint này. Nếu có, giá trị phải là
        `rowVersion` hiện tại; giá trị lệch nhận `409`, sai định dạng nhận `422`.
        Xóa thành công ghi `AuditLog` (`action = form_version_update`).
      x-screen: M7
      x-allowed-roles: [admin]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: "ETag của rowVersion hiện tại; tùy chọn cho thao tác xóa bản nháp."
          schema:
            type: string
            example: '"1"'
      responses:
        '200':
          description: "Đã xóa bản nháp phiên bản biểu mẫu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFormVersionDraftResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /admin/form-versions/{versionId}/preview:
    parameters:
      - $ref: '#/components/parameters/VersionIdParam'
    get:
      tags: [AdminForms]
      operationId: previewFormVersion
      summary: "M7 — Xem trước phiên bản biểu mẫu dưới góc nhìn Bác sĩ (tính khi gọi, không lưu bảng)"
      description: |
        Chỉ dành cho vai trò `admin` (`doctor` nhận `403`).
        Trả về cấu trúc kết xuất giống 100% với `getVisitForm` trên Màn 4 kèm cờ `isPreviewOnly: true` để Admin kiểm thử tương tác mà không lưu dữ liệu vào bệnh án.
      x-screen: M7
      x-allowed-roles: [admin]
      responses:
        '200':
          description: "Dữ liệu cấu trúc xem trước góc nhìn Bác sĩ"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersionPreviewResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /admin/form-versions/{versionId}/diff:
    parameters:
      - $ref: '#/components/parameters/VersionIdParam'
    get:
      tags: [AdminForms]
      operationId: diffFormVersion
      summary: "M7 — So sánh thay đổi (Diff) giữa bản nháp và phiên bản đối chiếu (tính khi gọi, không lưu bảng)"
      description: |
        Chỉ dành cho vai trò `admin` (`doctor` nhận `403`).
        Tính toán trực tiếp các thay đổi giữa `versionId` và `baseVersionId` thành 3 nhóm: `+ Thêm mới` (`addedFields`), `~ Cập nhật` (`modifiedFields`), và `- Ngừng dùng cho lượt mới` (`removedFields`).
      x-screen: M7
      x-allowed-roles: [admin]
      parameters:
        - name: baseVersionId
          in: query
          required: true
          description: "Định danh UUID của phiên bản biểu mẫu gốc dùng để đối chiếu (thường là bản published hiện hành)"
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Kết quả đối chiếu khác biệt giữa hai phiên bản biểu mẫu"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersionDiffResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /admin/form-versions/{versionId}/publish:
    parameters:
      - $ref: '#/components/parameters/VersionIdParam'
      - $ref: '#/components/parameters/IfMatchParam'
    post:
      tags: [AdminForms]
      operationId: publishFormVersion
      summary: "M7 — Phát hành phiên bản biểu mẫu mới cho các lượt khám tạo về sau"
      description: |
        Chỉ dành cho vai trò `admin` (`doctor` nhận `403`). Bắt buộc gửi `If-Match`.
        Thực thi trong giao dịch nguyên tử:
        1. Kiểm tra phiên bản đang ở trạng thái `draft` và toàn bộ cấu trúc nhóm/trường hợp lệ.
        2. Chuyển phiên bản `published` trước đó sang trạng thái `retired`.
        3. Chuyển phiên bản hiện tại sang `published`, ghi `publishedAt`, `publishedBy`, khóa bất biến.
        4. Ghi `AuditLog` (`action = form_version_publish`).
        Các lượt khám cũ vẫn giữ nguyên `formVersionId` cũ đã gắn lúc tạo.
      x-screen: M7
      x-allowed-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishFormVersionRequest'
      responses:
        '200':
          description: "Phát hành phiên bản biểu mẫu thành công"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersion'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /admin/audit-logs:
    get:
      tags: [AdminAuditLogs]
      operationId: listAuditLogs
      summary: "M8 — Tra cứu nhật ký kiểm toán hệ thống (chỉ siêu dữ liệu, không chứa nội dung lâm sàng)"
      description: |
        Chỉ dành cho vai trò `admin` (`doctor` nhận `403`).
        Hỗ trợ lọc theo người thực hiện (`actorUserId`), loại hành động (`action`), loại thực thể (`entityType`), mã thực thể (`entityId`) và khoảng thời gian (`fromDate`, `toDate`).
        Theo chốt K8, trường `detail` trong `AuditLog` tuyệt đối không chứa mật khẩu hay dữ liệu bệnh án lâm sàng.
      x-screen: M8
      x-allowed-roles: [admin]
      parameters:
        - name: actorUserId
          in: query
          required: false
          description: "Lọc theo UUID người thực hiện thao tác"
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          description: "Lọc theo mã hành động kiểm toán"
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: entityType
          in: query
          required: false
          description: "Lọc theo loại thực thể tác động"
          schema:
            type: string
            enum: [app_user, user_session, patient, visit, visit_revision, form_template, form_version, field_definition]
        - name: entityId
          in: query
          required: false
          description: "Lọc theo UUID thực thể tác động"
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          required: false
          description: "Thời điểm bắt đầu lọc (ISO 8601 date-time)"
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: false
          description: "Thời điểm kết thúc lọc (ISO 8601 date-time, phải >= fromDate)"
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: "Danh sách bản ghi nhật ký hệ thống phân trang"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Access Token cấp sau khi đăng nhập qua `/api/v1/auth/login`.
        Chứa `sub` (UUID của `AppUser`), `role` (`doctor` hoặc `admin`) và `sid` (`UserSession.id`).

  parameters:
    PatientIdParam:
      name: patientId
      in: path
      required: true
      description: "Định danh UUID nội bộ của hồ sơ bệnh nhân"
      schema:
        type: string
        format: uuid
    VisitIdParam:
      name: visitId
      in: path
      required: true
      description: "Định danh UUID của lượt khám"
      schema:
        type: string
        format: uuid
    UserIdParam:
      name: userId
      in: path
      required: true
      description: "Định danh UUID của tài khoản người dùng"
      schema:
        type: string
        format: uuid
    FormIdParam:
      name: formId
      in: path
      required: true
      description: "Định danh UUID của mẫu biểu mẫu logic (FormTemplate)"
      schema:
        type: string
        format: uuid
    VersionIdParam:
      name: versionId
      in: path
      required: true
      description: "Định danh UUID của phiên bản biểu mẫu (FormVersion)"
      schema:
        type: string
        format: uuid
    IfMatchParam:
      name: If-Match
      in: header
      required: true
      description: |
        Giá trị ETag đại diện cho `rowVersion` hiện tại của bản ghi (ví dụ `"1"`, `"2"` hoặc `W/"2"`).
        Nếu không khớp với `rowVersion` trên máy chủ, thao tác ghi bị từ chối với mã `409 Conflict`.
      schema:
        type: string
        example: '"1"'
    PageParam:
      name: page
      in: query
      required: false
      description: "Số thứ tự trang (bắt đầu từ 1)"
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: "Số lượng bản ghi tối đa trên một trang"
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    ETagHeader:
      description: "Giá trị ETag hiện tại của tài nguyên tương ứng với rowVersion"
      schema:
        type: string
        example: '"2"'

  responses:
    UnauthorizedError:
      description: "401 Unauthorized — Chưa đăng nhập, thông tin đăng nhập không đúng hoặc token đã hết hạn/bị thu hồi"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: "403 Forbidden — Không đủ quyền truy cập theo ranh giới RBAC (doctor vs admin) hoặc tài khoản đã bị khóa"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: "404 Not Found — Không tìm thấy tài nguyên theo định danh UUID yêu cầu"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ConflictError:
      description: "409 Conflict — Xung đột sửa đồng thời (lệch ETag/rowVersion), vi phạm tính bất biến (form_version đã published, visit đã confirmed) hoặc trùng khóa duy nhất"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntityError:
      description: "422 Unprocessable Entity — Dữ liệu đầu vào sai kiểu, vượt miền giá trị kỹ thuật hoặc chưa đạt điều kiện Tầng 3 khi xác nhận"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    # =========================================================================
    # 1. Mười kiểu Enum chuẩn hóa (Khớp 100% mục 4.2 CONTRACT.md & schema_metadata.json)
    # =========================================================================
    UserRole:
      type: string
      x-db-enum: user_role
      description: "Vai trò người dùng trong hệ thống (user_role)"
      enum:
        - doctor
        - admin

    VisitStatus:
      type: string
      x-db-enum: visit_status
      description: "Trạng thái của lượt khám (visit_status)"
      enum:
        - draft
        - confirmed

    ValueState:
      type: string
      x-db-enum: value_state
      description: "Trạng thái câu trả lời của trường đã lưu (value_state). Trường chưa điền không tạo dòng trong visit_value."
      enum:
        - answered
        - unknown

    FormVersionStatus:
      type: string
      x-db-enum: form_version_status
      description: "Trạng thái vòng đời của phiên bản biểu mẫu (form_version_status)"
      enum:
        - draft
        - published
        - retired

    FieldScopeStatus:
      type: string
      x-db-enum: field_scope_status
      description: "Phân loại phạm vi trường dữ liệu từ bảng truy vết Chặng A (field_scope_status)"
      enum:
        - mvp
        - can_xac_nhan

    FieldDataType:
      type: string
      x-db-enum: field_data_type
      description: "Kiểu dữ liệu của trường cấu hình (field_data_type)"
      enum:
        - number
        - integer
        - text
        - boolean
        - date
        - single_choice
        - multi_choice

    SectionCode:
      type: string
      x-db-enum: section_code
      description: "Mã 8 nhóm biểu mẫu chuẩn tiếng Việt không dấu (section_code)"
      enum:
        - hanh_chinh
        - trieu_chung_dien_bien
        - sinh_ton_kham
        - benh_su_dong_mac
        - thuoc_di_ung
        - can_lam_sang
        - lao_khoa
        - ghi_chu

    ReadinessTier:
      type: string
      x-db-enum: readiness_tier
      description: "Bốn tầng điều kiện dữ liệu độc lập theo chốt K1 (readiness_tier)"
      enum:
        - patient_created
        - draft_saved
        - confirmed
        - ai_ready

    BpPosition:
      type: string
      x-db-enum: bp_position
      description: "Tư thế đo huyết áp (bp_position)"
      enum:
        - supine
        - sitting
        - standing

    AuditAction:
      type: string
      x-db-enum: audit_action
      description: "Mã hành động kiểm toán hệ thống (audit_action)"
      enum:
        - login
        - logout
        - login_failed
        - user_create
        - user_update
        - form_version_create
        - form_version_update
        - form_version_publish
        - patient_create
        - visit_confirm

    # =========================================================================
    # 2. Mười chín thực thể bảng CSDL & Hợp đồng AiInputPayload (Khớp 100% schema_metadata.json)
    # =========================================================================
    AppUser:
      type: object
      x-db-table: app_user
      x-db-excluded-columns: [password_hash]
      description: "Tài khoản người dùng hệ thống (bảng app_user). Cột password_hash chỉ lưu ở tầng CSDL, tuyệt đối không xuất ra JSON."
      required:
        - id
        - username
        - fullName
        - role
        - isActive
        - rowVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 64
          example: bs.minh
        fullName:
          type: string
          minLength: 1
          maxLength: 120
          example: "BS. Nguyễn Quang Minh"
        role:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
          example: true
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        rowVersion:
          type: integer
          minimum: 1
          default: 1
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserSession:
      type: object
      x-db-table: user_session
      x-db-excluded-columns: [refresh_token_hash]
      description: "Phiên đăng nhập của người dùng (bảng user_session). Mã băm refresh_token_hash chỉ lưu ở tầng CSDL."
      required:
        - id
        - userId
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        ip:
          type: [string, 'null']
        userAgent:
          type: [string, 'null']
          maxLength: 255
        createdAt:
          type: string
          format: date-time

    Patient:
      type: object
      x-db-table: patient
      description: "Hồ sơ hành chính bệnh nhân ở Tầng 1 (bảng patient). Mã patientCode có dạng BN-\\d{5} do hệ thống tự sinh và bất biến."
      required:
        - id
        - patientCode
        - fullName
        - sex
        - rowVersion
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        patientCode:
          type: string
          pattern: '^BN-[0-9]{5}$'
          readOnly: true
          example: BN-00142
        externalPatientCode:
          type: [string, 'null']
          maxLength: 64
          description: "Mã định danh ngoài (nếu có), tách riêng khỏi patientCode BN-xxxxx"
        fullName:
          type: string
          minLength: 2
          maxLength: 120
          example: "Nguyễn Văn A (Hồ sơ minh họa)"
        sex:
          type: string
          enum: [male, female, unknown]
          example: male
        birthDate:
          type: [string, 'null']
          format: date
        birthYear:
          type: [integer, 'null']
          minimum: 1900
          maximum: 2100
          example: 1948
        declaredAge:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        rowVersion:
          type: integer
          minimum: 1
          example: 1
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FieldDefinition:
      type: object
      x-db-table: field_definition
