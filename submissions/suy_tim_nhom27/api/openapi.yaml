        - Tạo revision mới với `revisionNo` tăng tiếp nối, mở lại trạng thái chỉnh sửa có kiểm soát và ghi nhật ký kiểm toán.
        - Nếu chính sách vận hành đang khóa cứng sửa sau xác nhận (theo cấu hình mặc định K5/Q3), máy chủ trả `409 Conflict` với mã lỗi `VISIT_CONFIRMED_LOCKED`.
