      properties:
        rowVersion:
          type: integer
          minimum: 1
        changeReason:
          type: string
          minLength: 5
          maxLength: 500
          description: "Lý do bắt buộc khi mở bản sửa mới sau khi lượt khám đã xác nhận"

    UserListResponse:
      type: object
      required:
        - items
