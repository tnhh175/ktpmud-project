openapi: 3.1.0
info:
  title: "Hệ thống Thu thập và Xác nhận Dữ liệu Lâm sàng Suy tim Trước AI (MVP API)"
  version: 1.0.0
  summary: "Đặc tả REST API Chặng C cho hai luồng Bác sĩ (M1-M5) và Quản trị viên (M6-M8)"
  description: |
    Đặc tả OpenAPI 3.1.0 cho phạm vi MVP (Nhóm chức năng 1: Hồ sơ bệnh án và lượt khám;
    Nhóm chức năng 2: Tiếp nhận và tiền xử lý dữ liệu nhập tay; Nhóm chức năng 6: Quản trị hệ thống và dữ liệu dùng chung).

    Các nguyên tắc kiến trúc khóa cứng (K1-K10):
    - K1: Tách bạch 4 tầng điều kiện (patient_created, draft_saved, confirmed, ai_ready). Tầng 4 không chặn xác nhận lượt khám.
    - K2: Ba trạng thái câu trả lời (chưa điền = không có bản ghi; valueState = unknown là Chưa rõ; valueState = answered kèm giá trị kể cả 0 hoặc false).
    - K3: Biểu mẫu chạy theo metadata, mỗi lượt khám gắn cứng formVersionId lúc khởi tạo.
    - K4: Phiên bản biểu mẫu đã published hoặc đã có lượt khám sử dụng là bất biến ở cả API (409) và DB trigger.
    - K5: Lượt khám đã confirmed chuyển sang chế độ chỉ đọc; sửa sau xác nhận phải qua createVisitRevision kèm lý do và lưu bản chụp VisitRevision.
    - K6: Bảng lặp là thực thể tách biệt (OrthostaticBpMeasurement, VisitMedication, VisitAllergy, VisitLabResult).
    - K7: Tách riêng các mã cận lâm sàng (cls_bnp vs cls_nt_probnp, cls_creatinin vs cls_egfr, cls_lvef vs cls_sieu_am_tim_ket_luan).
    - K8: Tách quyền RBAC nghiêm ngặt — vai trò admin không có quyền đọc hay sửa hồ sơ bệnh nhân và dữ liệu lâm sàng (trả 403).
    - K9: Loại bỏ hoàn toàn các đường dẫn ngoài phạm vi MVP; chỉ cung cấp hợp đồng đầu ra chuẩn AiInputPayload cho lượt khám đã xác nhận.
    - K10: Mã bệnh nhân patientCode theo định dạng BN-\d{5} do máy chủ tự sinh, bất biến; khóa nội bộ là UUID.
  contact:
    name: "Nhóm 27 - Kiến trúc API Chặng C"
  license:
    name: "Internal Academic License"
    identifier: "LicenseRef-KTPMUD-Nhom27"

servers:
  - url: /api/v1
    description: "Máy chủ REST API chính thức (Tiền tố chuẩn /api/v1)"

tags:
  - name: Auth
    description: "Màn 1 (M1) — Đăng nhập chung, làm mới phiên, đăng xuất và lấy thông tin tài khoản hiện tại"
  - name: Patients
    description: "Màn 2 & Màn 3 (M2-M3) — Quản lý hồ sơ hành chính bệnh nhân (chỉ dành cho vai trò doctor)"
  - name: Visits
    description: "Màn 3, Màn 4 & Màn 5 (M3-M5) — Lượt khám, biểu mẫu gắn cứng, lưu nháp, xem lại, xác nhận, tạo revision và xuất AiInputPayload (chỉ dành cho vai trò doctor)"
  - name: AdminUsers
    description: "Màn 6 (M6) — Quản trị tài khoản và xem trước phạm vi quyền (chỉ dành cho vai trò admin)"
  - name: AdminForms
    description: "Màn 7 (M7) — Quản trị danh mục trường, biểu mẫu và vòng đời phiên bản biểu mẫu (chỉ dành cho vai trò admin)"
  - name: AdminAuditLogs
    description: "Màn 8 (M8) — Tra cứu nhật ký kiểm toán hệ thống không chứa dữ liệu lâm sàng (chỉ dành cho vai trò admin)"

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: "M1 — Đăng nhập chung cho Bác sĩ và Quản trị viên"
      description: |
        Xác thực bằng username và password qua một cổng đăng nhập duy nhất.
        Máy chủ tự xác định vai trò (`doctor` hoặc `admin`) từ hồ sơ tài khoản, không nhận vai trò từ client.
        Ghi nhật ký `login` khi thành công hoặc `login_failed` khi thất bại.
      security: []
      x-screen: M1
      x-allowed-roles: [doctor, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: "Đăng nhập thành công, trả về cặp token và thông tin người dùng"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: "M1 — Làm mới access token từ refresh token hợp lệ"
      description: |
        Đối chiếu mã băm refresh token trong bảng `user_session`.
        Từ chối bằng `401` nếu phiên đã hết hạn (`expires_at`) hoặc đã bị thu hồi (`revoked_at`).
      security: []
      x-screen: M1
      x-allowed-roles: [doctor, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: "Làm mới phiên thành công"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: "Tự đổi mật khẩu tài khoản hiện tại"
      description: |
        Bác sĩ và Quản trị viên đã đăng nhập có thể tự đổi mật khẩu.
        Mật khẩu hiện tại sai trả 422 với mã `CURRENT_PASSWORD_INCORRECT` và
        `errors.fieldCode = currentPassword`. Mật khẩu mới trùng mật khẩu cũ
        trả 422 `FIELD_VALIDATION_FAILED` tại `newPassword`.
        Sau khi đổi thành công, giữ phiên hiện tại và thu hồi mọi phiên khác
        của cùng người dùng. Không trả hoặc ghi mật khẩu, mã băm hay token.
      x-screen: M1
      x-allowed-roles: [doctor, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: "Thông tin tài khoản đã cập nhật, phiên hiện tại vẫn có hiệu lực"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: "M1 — Đăng xuất và thu hồi phiên hiện tại"
      description: |
        Cập nhật `revoked_at` cho bản ghi `user_session` hiện hành và ghi nhật ký `logout`.
      x-screen: M1
      x-allowed-roles: [doctor, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: "Đăng xuất thành công, phiên đã bị thu hồi"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: "M1 — Lấy thông tin tài khoản và vai trò từ phiên xác thực hiện tại"
      description: |
        Trả về thông tin `AppUser` của người dùng đang đăng nhập để giao diện điều hướng đúng luồng `doctor` hoặc `admin`.
      x-screen: M1
      x-allowed-roles: [doctor, admin]
      responses:
        '200':
          description: "Thông tin tài khoản hiện hành"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: "M2 — Danh sách và tìm kiếm hồ sơ bệnh nhân"
      description: |
        Chỉ cho phép vai trò `doctor`. Vai trò `admin` gọi đường dẫn này sẽ bị chặn với mã `403 Forbidden` (chốt K8).
        Hỗ trợ tìm kiếm theo mã `BN-xxxxx` hoặc tên hiển thị, lọc theo trạng thái lượt khám gần nhất và phân trang chuẩn.
      x-screen: M2
      x-allowed-roles: [doctor]
      parameters:
        - name: q
          in: query
          required: false
          description: "Từ khóa tìm kiếm theo mã BN-xxxxx hoặc tên hiển thị"
          schema:
            type: string
            maxLength: 100
        - name: latestVisitStatus
          in: query
          required: false
          description: "Lọc theo trạng thái lượt khám gần nhất (draft, confirmed, hoặc none khi chưa có lượt)"
          schema:
            type: string
            enum: [draft, confirmed, none]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: "Danh sách hồ sơ bệnh nhân phân trang"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

    post:
      tags: [Patients]
      operationId: createPatient
      summary: "M2 — Tạo mới hồ sơ hành chính bệnh nhân (Tầng điều kiện 1 - patient_created)"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` bị từ chối `403`).
        Máy chủ tự sinh `patientCode` duy nhất theo mẫu `BN-\d{5}` (chốt K10), lưu đúng độ chính xác của ngày sinh/năm sinh/tuổi khai báo (không tự tạo ngày giả 01/01) và ghi `AuditLog` (`action = patient_create`).
      x-screen: M2
      x-allowed-roles: [doctor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: "Tạo hồ sơ bệnh nhân thành công (đạt tầng readiness_tier = patient_created)"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /patients/{patientId}:
    parameters:
      - $ref: '#/components/parameters/PatientIdParam'
    get:
      tags: [Patients]
      operationId: getPatient
      summary: "M3 — Xem chi tiết hồ sơ hành chính bệnh nhân và tóm tắt lượt gần nhất"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Trả về thông tin hành chính `Patient` và tóm tắt lâm sàng lượt gần nhất (chỉ khi đã có ghi nhận thực tế, kèm nguồn `visitId`, `formVersionId`, `rowVersion`).
      x-screen: M3
      x-allowed-roles: [doctor]
      responses:
        '200':
          description: "Chi tiết hồ sơ bệnh nhân"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

    patch:
      tags: [Patients]
      operationId: updatePatient
      summary: "M3 — Cập nhật thông tin hành chính hồ sơ bệnh nhân"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Bắt buộc kiểm soát đồng thời bằng `If-Match` / `rowVersion`. Mã `patientCode` (`BN-xxxxx`) là bất biến, không cho phép sửa.
      x-screen: M3
      x-allowed-roles: [doctor]
      parameters:
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: "Cập nhật hành chính bệnh nhân thành công"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /patients/{patientId}/visits:
    parameters:
      - $ref: '#/components/parameters/PatientIdParam'
    get:
      tags: [Visits]
      operationId: listPatientVisits
      summary: "M3 — Lấy dòng thời gian (timeline) các lượt khám của bệnh nhân"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Trả về danh sách các lượt khám của bệnh nhân theo thứ tự thời gian mới nhất lên đầu, kèm trạng thái `draft`/`confirmed`, `formVersionId` và `rowVersion`.
      x-screen: M3
      x-allowed-roles: [doctor]
      parameters:
        - name: status
          in: query
          required: false
          description: "Lọc theo trạng thái lượt khám"
          schema:
            $ref: '#/components/schemas/VisitStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: "Danh sách dòng thời gian lượt khám của bệnh nhân"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

    post:
      tags: [Visits]
      operationId: createVisit
      summary: "M4 — Tạo lượt khám mới gắn cứng phiên bản biểu mẫu published hiện hành"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Khởi tạo lượt khám mới ở trạng thái `draft`, tự động gắn cứng `formVersionId` của phiên bản `published` đang hoạt động (chốt K3).
        Biểu mẫu khởi tạo trắng, tuyệt đối không sao chép số đo sinh hiệu, xét nghiệm hay đơn thuốc từ lượt khám cũ.
      x-screen: M4
      x-allowed-roles: [doctor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitRequest'
      responses:
        '201':
          description: "Tạo lượt khám mới thành công"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /visits/{visitId}:
    parameters:
      - $ref: '#/components/parameters/VisitIdParam'
    get:
      tags: [Visits]
      operationId: getVisit
      summary: "M4 — Lấy toàn bộ dữ liệu hiện tại của một lượt khám"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Trả về thông tin `Visit`, danh sách giá trị trường đơn `VisitValue`, 4 bảng bản ghi lặp (`OrthostaticBpMeasurement`, `VisitMedication`, `VisitAllergy`, `VisitLabResult`) và danh sách các bản chụp `VisitRevision`.
      x-screen: M4
      x-allowed-roles: [doctor]
      responses:
        '200':
          description: "Dữ liệu chi tiết của lượt khám"
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /visits/{visitId}/form:
    parameters:
      - $ref: '#/components/parameters/VisitIdParam'
    get:
      tags: [Visits]
      operationId: getVisitForm
      summary: "M4 — Lấy cấu trúc phiên bản biểu mẫu đã gắn cứng với lượt khám"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Trả về cấu trúc `FormVersion` gắn với `visit.formVersionId` gồm 8 `FormSection`, danh sách `FormField`, định nghĩa `FieldDefinition` và các lựa chọn `FieldOption`.
        Đảm bảo lượt khám cũ luôn hiển thị đúng phiên bản biểu mẫu tại thời điểm tạo lượt khám.
      x-screen: M4
      x-allowed-roles: [doctor]
      responses:
        '200':
          description: "Cấu trúc biểu mẫu gắn với lượt khám"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitFormStructureResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'

  /visits/{visitId}/draft:
    parameters:
      - $ref: '#/components/parameters/VisitIdParam'
      - $ref: '#/components/parameters/IfMatchParam'
    put:
      tags: [Visits]
      operationId: saveVisitDraft
      summary: "M4 — Lưu nháp dữ liệu lượt khám và các bảng bản ghi lặp (Tầng điều kiện 2 - draft_saved)"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`).
        Bắt buộc gửi header `If-Match` khớp với `rowVersion` hiện tại của `Visit`.
        - Tầng 2 (`draft_saved`): Cho phép lưu nháp khi còn thiếu các trường lâm sàng.
        - Phân biệt rõ 3 trạng thái: trường không gửi trong `values` là **chưa điền** (xóa dòng `visit_value` nếu có); `valueState = unknown` là **Chưa rõ** (mọi cột giá trị bằng null); `valueState = answered` kèm đúng một giá trị khớp `dataType` (bảo toàn số `0` hoặc `false`).
        - Cập nhật đồng bộ các bảng lặp: `orthostaticBp`, `medications`, `allergies`, `labResults`.
        - Trả `409 Conflict` nếu `If-Match` lệch `rowVersion` hoặc nếu lượt khám đang ở trạng thái `confirmed` (chốt K5).
        - Trả `422 Unprocessable Entity` nếu có trường sai kiểu hoặc vượt miền kỹ thuật (ví dụ `SpO2 > 100`, `LVEF < 0`, `diastolic >= systolic`).
