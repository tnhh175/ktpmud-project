          example: "Vai trò Quản trị viên (admin) bị tách biệt hoàn toàn khỏi quyền đọc và chỉnh sửa bệnh án lâm sàng."
        grantedPermissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionItem'
        deniedPermissions:
