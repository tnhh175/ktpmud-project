      x-allowed-roles: [doctor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveVisitDraftRequest'
      responses:
        '200':
          description: "Lưu nháp thành công, trả về dữ liệu lượt khám kèm ETag và rowVersion mới"
