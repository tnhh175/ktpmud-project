  /visits/{visitId}/confirm:
    parameters:
      - $ref: '#/components/parameters/VisitIdParam'
      - $ref: '#/components/parameters/IfMatchParam'
    post:
      tags: [Visits]
      operationId: confirmVisit
      summary: "M5 — Xác nhận dữ liệu lượt khám (Tầng điều kiện 3 - confirmed)"
      description: |
        Chỉ dành cho vai trò `doctor` (`admin` nhận `403`). Bắt buộc gửi `If-Match`.
        Thực thi trong một giao dịch nguyên tử:
        1. Kiểm tra toàn bộ điều kiện Tầng 3 (`requiredForConfirm` và tính hợp lệ kỹ thuật). Nếu chưa đạt, trả `422`.
        2. Chuyển `visit.status` sang `confirmed`, ghi `confirmedAt`, `confirmedBy`, tăng `rowVersion`.
        3. Lưu bản chụp bất biến vào bảng `visit_revision` (`VisitRevision`).
        4. Ghi nhật ký hệ thống `AuditLog` (`action = visit_confirm`, không chứa nội dung lâm sàng nhạy cảm).
        Lưu ý pháp lý: Thao tác này xác nhận dữ liệu lượt khám đã được bác sĩ rà soát, không phải xác nhận chẩn đoán hay y lệnh điều trị.
      x-screen: M5
      x-allowed-roles: [doctor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmVisitRequest'
      responses:
        '200':
          description: "Xác nhận dữ liệu lượt khám thành công"
